<!DOCTYPE html>
<!-- NAME: dashboard
     DESC: Responsive admin dashboard: CSS grid layout with sidebar, stat cards, SVG bar chart drawn by JS, sortable table, no libraries.
     KEYWORDS: dashboard, admin, sidebar, grid, svg chart, bar chart, table, sort, responsive, stat cards, no library, javascript -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard</title>
<style>
:root { --bg:#eef4f9; --card:#fff; --ink:#15283a; --muted:#607487; --brand:#1c8fd1; }
* { box-sizing: border-box; margin: 0; }
body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--ink); display: grid; grid-template-columns: 200px 1fr; min-height: 100vh; }
aside { background: #0e2a3d; color: #cfe3f1; padding: 1.2rem; }
aside a { display: block; color: inherit; text-decoration: none; padding: .5rem .6rem; border-radius: 8px; }
aside a[aria-current=page], aside a:hover { background: #1b4560; }
main { padding: 1.4rem; display: grid; gap: 1.2rem; align-content: start; }
.stats { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
.card { background: var(--card); border-radius: 14px; padding: 1.1rem; box-shadow: 0 2px 10px rgb(0 0 0 / .05); }
.card small { color: var(--muted); }
.card b { display: block; font-size: 1.7rem; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: .55rem; border-bottom: 1px solid #e3ebf1; }
th { cursor: pointer; user-select: none; }
th[aria-sort]::after { content: " \2195"; color: var(--muted); }
@media (max-width: 700px) { body { grid-template-columns: 1fr; } aside { display: flex; gap: .5rem; overflow-x: auto; } }
</style>
</head>
<body>
<aside><strong style="display:block;margin-bottom:1rem">Glacier</strong>
  <nav aria-label="Sections"><a href="#" aria-current="page">Overview</a><a href="#">Orders</a><a href="#">Customers</a></nav></aside>
<main>
  <section class="stats" aria-label="Key numbers">
    <div class="card"><small>Revenue</small><b id="s1"></b></div>
    <div class="card"><small>Orders</small><b id="s2"></b></div>
    <div class="card"><small>Customers</small><b id="s3"></b></div>
  </section>
  <section class="card"><h2 style="font-size:1rem;margin-bottom:.6rem">Monthly sales</h2><svg id="chart" viewBox="0 0 480 180" width="100%" role="img" aria-label="Bar chart of monthly sales"></svg></section>
  <section class="card"><h2 style="font-size:1rem;margin-bottom:.6rem">Orders</h2>
    <table id="t"><thead><tr><th data-k="id" aria-sort="none">ID</th><th data-k="name" aria-sort="none">Customer</th><th data-k="amount" aria-sort="none">Amount</th></tr></thead><tbody></tbody></table></section>
</main>
<script>
const months = ["Jan","Feb","Mar","Apr","May","Jun"], sales = [120, 180, 150, 220, 260, 240];
const orders = [{ id: 101, name: "Asha", amount: 250 }, { id: 102, name: "Ravi", amount: 90 }, { id: 103, name: "Meera", amount: 430 }, { id: 104, name: "Karan", amount: 175 }];
const money = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });
document.getElementById("s1").textContent = money.format(sales.reduce((a, b) => a + b, 0) * 100);
document.getElementById("s2").textContent = orders.length * 311;
document.getElementById("s3").textContent = "1,284";

const svg = document.getElementById("chart"), NS = "http://www.w3.org/2000/svg", max = Math.max(...sales);
sales.forEach((v, i) => {
  const h = (v / max) * 140, x = 20 + i * 75;
  const r = document.createElementNS(NS, "rect");
  r.setAttribute("x", x); r.setAttribute("y", 150 - h); r.setAttribute("width", 50); r.setAttribute("height", h); r.setAttribute("rx", 6); r.setAttribute("fill", "#1c8fd1");
  const t = document.createElementNS(NS, "text");
  t.setAttribute("x", x + 25); t.setAttribute("y", 168); t.setAttribute("text-anchor", "middle"); t.setAttribute("font-size", 12); t.setAttribute("fill", "#607487"); t.textContent = months[i];
  svg.append(r, t);
});

let sortKey = "id", asc = true;
function renderTable() {
  const rows = [...orders].sort((a, b) => (a[sortKey] > b[sortKey] ? 1 : -1) * (asc ? 1 : -1));
  const body = document.querySelector("#t tbody"); body.replaceChildren();
  for (const o of rows) {
    const tr = body.insertRow();
    tr.insertCell().textContent = o.id; tr.insertCell().textContent = o.name; tr.insertCell().textContent = money.format(o.amount);
  }
}
document.querySelector("#t thead").addEventListener("click", (e) => {
  const k = e.target.dataset.k; if (!k) return;
  asc = sortKey === k ? !asc : true; sortKey = k;
  document.querySelectorAll("#t th").forEach((th) => th.setAttribute("aria-sort", th.dataset.k === k ? (asc ? "ascending" : "descending") : "none"));
  renderTable();
});
renderTable();
</script>
</body>
</html>
