<!DOCTYPE html>
<!-- NAME: calculator
     DESC: Calculator web app: buttons + keyboard input, safe expression evaluation WITHOUT eval (shunting-yard), history, CSS grid keypad.
     KEYWORDS: calculator, javascript, keypad, grid, keyboard events, no eval, parser, shunting yard, app -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculator</title>
<style>
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0e1b26; font-family: system-ui, sans-serif; }
.calc { width: min(320px, 92vw); background: #17293a; padding: 1rem; border-radius: 18px; }
#screen { background: #0b141c; color: #e7f3ff; text-align: right; padding: .8rem; border-radius: 10px; min-height: 4.2rem; }
#expr { font-size: .95rem; color: #7f9bb2; min-height: 1.2rem; word-break: break-all; }
#out { font-size: 2rem; word-break: break-all; }
.keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: .5rem; margin-top: .8rem; }
button { font: inherit; font-size: 1.15rem; padding: .9rem 0; border: 0; border-radius: 10px; background: #243b50; color: #e7f3ff; cursor: pointer; }
button:hover, button:focus-visible { filter: brightness(1.25); }
button.op { background: #1c8fd1; }
button.eq { background: #28b46e; grid-row: span 2; }
button.wide { grid-column: span 2; }
</style>
</head>
<body>
<div class="calc" role="application" aria-label="Calculator">
  <div id="screen" aria-live="polite"><div id="expr"></div><div id="out">0</div></div>
  <div class="keys" id="keys">
    <button data-k="C" class="op">C</button><button data-k="(" class="op">(</button><button data-k=")" class="op">)</button><button data-k="/" class="op">&divide;</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button data-k="*" class="op">&times;</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button data-k="-" class="op">&minus;</button>
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button data-k="+" class="op">+</button>
    <button data-k="0" class="wide">0</button><button data-k=".">.</button><button data-k="B" class="op">&larr;</button>
    <button data-k="=" class="eq" style="grid-column:4;grid-row:5 / span 1">=</button>
  </div>
</div>
<script>
"use strict";
// Safe evaluator: tokenise -> shunting-yard -> RPN. No eval(), no Function().
const PREC = { "+": 1, "-": 1, "*": 2, "/": 2, "u-": 3 };
function tokenize(src) {
  const out = []; let i = 0, prev = null;
  while (i < src.length) {
    const c = src[i];
    if (c === " ") { i++; continue; }
    if (/[0-9.]/.test(c)) {
      let j = i; while (j < src.length && /[0-9.]/.test(src[j])) j++;
      const n = src.slice(i, j);
      if ((n.match(/\./g) || []).length > 1) throw new Error("Bad number");
      out.push({ t: "num", v: parseFloat(n) }); prev = "num"; i = j; continue;
    }
    if ("+-*/".includes(c)) {
      const unary = c === "-" && (prev === null || prev === "op" || prev === "(");
      out.push({ t: "op", v: unary ? "u-" : c }); prev = "op"; i++; continue;
    }
    if (c === "(") { out.push({ t: "(" }); prev = "("; i++; continue; }
    if (c === ")") { out.push({ t: ")" }); prev = ")"; i++; continue; }
    throw new Error("Bad character");
  }
  return out;
}
function toRPN(tokens) {
  const out = [], st = [];
  for (const tk of tokens) {
    if (tk.t === "num") out.push(tk);
    else if (tk.t === "op") {
      while (st.length && st[st.length - 1].t === "op" && PREC[st[st.length - 1].v] >= PREC[tk.v] && tk.v !== "u-") out.push(st.pop());
      st.push(tk);
    } else if (tk.t === "(") st.push(tk);
    else {
      while (st.length && st[st.length - 1].t !== "(") out.push(st.pop());
      if (!st.length) throw new Error("Mismatched )");
      st.pop();
    }
  }
  while (st.length) { const t = st.pop(); if (t.t === "(") throw new Error("Mismatched ("); out.push(t); }
  return out;
}
function evalRPN(rpn) {
  const s = [];
  for (const tk of rpn) {
    if (tk.t === "num") s.push(tk.v);
    else if (tk.v === "u-") { if (!s.length) throw new Error("Syntax"); s.push(-s.pop()); }
    else {
      if (s.length < 2) throw new Error("Syntax");
      const b = s.pop(), a = s.pop();
      if (tk.v === "/" && b === 0) throw new Error("Divide by zero");
      s.push(tk.v === "+" ? a + b : tk.v === "-" ? a - b : tk.v === "*" ? a * b : a / b);
    }
  }
  if (s.length !== 1) throw new Error("Syntax");
  return s[0];
}
const calculate = (src) => evalRPN(toRPN(tokenize(src)));

let expr = "";
const exprEl = document.getElementById("expr"), outEl = document.getElementById("out");
function show(res) { exprEl.textContent = expr; outEl.textContent = res ?? (expr || "0"); }
function press(k) {
  if (k === "C") expr = "";
  else if (k === "B") expr = expr.slice(0, -1);
  else if (k === "=") {
    try { const r = Math.round(calculate(expr) * 1e10) / 1e10; exprEl.textContent = expr + " ="; outEl.textContent = String(r); expr = String(r); return; }
    catch (e) { exprEl.textContent = expr; outEl.textContent = "Error: " + e.message; return; }
  } else expr += k;
  show();
}
document.getElementById("keys").addEventListener("click", (e) => { if (e.target.dataset.k) press(e.target.dataset.k); });
document.addEventListener("keydown", (e) => {
  if (/^[0-9+\-*/().]$/.test(e.key)) press(e.key);
  else if (e.key === "Enter") { e.preventDefault(); press("="); }
  else if (e.key === "Backspace") press("B");
  else if (e.key === "Escape") press("C");
});
</script>
</body>
</html>
